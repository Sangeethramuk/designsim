# ── KV Namespace: permanent share storage ────────────────────────────────────
# Setup (one-time):
#   cd worker
#   npx wrangler kv:namespace create SHARES
# Copy the `id` it prints and paste below, then redeploy:
#   npx wrangler deploy
[[kv_namespaces]]
binding = "SHARES"
id = "ced93a56336145f2aca876b3ef12191a"

# Secrets (set via: wrangler secret put SECRET_NAME)
# SUPABASE_JWT_SECRET — REQUIRED for per-user JWT auth (Supabase → Project Settings → API → JWT Secret)
# LLM_BASE_URL   — e.g. https://api.moonshot.cn
# LLM_API_KEY    — your LLM provider API key
# FIGMA_TOKEN    — Figma personal access token (optional)
# BRAVE_API_KEY  — Brave Search API key (optional)
# WORKER_SECRET  — OPTIONAL fallback for dev/legacy (X-Worker-Secret header)
#
# Public vars (set in [vars] above or via dashboard):
# SUPABASE_URL       — your Supabase project URL
# SUPABASE_ANON_KEY — your Supabase anon/public key
# ALLOWED_ORIGINS   — comma-separated list of allowed CORS origins
